<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 class="product-title">Выбери свой продукт</h1>
        <button id="change-first-card-color-button">Сменить цвет первой карточки </button>
        <button id="change-card-for-all-color-button">Сменить цвет всех карточек</button>
        <button id="open-google">Открыть страницу Google</button>
        <button id="output-console-log">Вывести сообщение в консоль лог</button>
        <button id="btn-toggle"> изменения цвета заголовка </button>
        <form id="form-registration">
            <button id="registration">Регистрация</button>
            <div id="modal" class="modal-container">
                <div class="modal-showed">
                    <input type="text" class="input-registration" name="name" placeholder="введите имя" required>
                    <input type="text" class="input-registration" name="surname" placeholder="введите фамилию" required>
                    <input type="date" class="input-registration" name="birthDay" placeholder="введите дату рождения">
                    <input type="password" id="modal-password" class="input-registration" name="password" placeholder="введите пароль" required minlength="5">
                    <input type="password" id="modal-passwordAgain" class="input-registration" name="confirm password" placeholder="подтвердите пароль" required minlength="5">
                    <input type="submit" id=" submit-btn" class="input-registration" name="отправить" required>
                    <button id="close-web" class="close-btn"> x </button>
                </div>
            </div>
        </form>
        <ul class="product-list">
        </ul>
        <template id="product-template">
            <li class="card">
                <img src="" alt="" />
                <span class="card__label"></span>
                <h2 class="card__title"></h2>
                <p class="card__description"></p>
                <span class="card__compound">Состав: </span>
                <ul class="card__description component">
                    <li class="component__list"></li>
                </ul>
                <div class="price">
                    <b>Цена</b>
                    <span></span>
                </div>
            </li>
            
        </template>
        <footer class="footer"> 
            <div class="footer__left-block">
                <h1 class="card__footer">Product Cards</h1>
                <h2 class="footer__description">У Нас Самые Лучшие Продукты Для Ложи</h2>
                <div class="footer__icon">
                    <a href="#">
                        <img src="images/Vector (1).png"  alt="">
                    </a>
                    <a href="">
                        <img src="images/Vector.png" alt="">
                    </a>
                </div>
            </div>
            <form id="email-form">
                <div class="footer__centre-block">
                    <p class="footer-subscribe">Подпишись на наши акции:</p>
                    <div class="footer__form-wrapper">
                        <input type="email" name="email" placeholder="Введите Email" class="inp" required>
                        <button class="footer-subscribe-btn">Подписаться</button>
                    </div>
                </div>
            </form>
            <nav class="footer__menu">
                <ul class="footer__list">
                    <li class="link">Быстрые сылки</li>
                    
                    <li>Главная</li>
                    <li>Магазин</li>
                    <li>Контакты</li>
                </ul>
            </nav>
            <!-- </div> -->
            <div class="footer__copyright">
                <hr class="footer__copyright-divider">
                <div class="footer__copyright-text"> 
                    <span>www.product-cards.com©all right reserve</span>
                </div>
            </div>
        </footer>
        <script src="main.js"></script>
        <script src="homework-7.js"></script>
        <script src="homework-8.js"></script>
        <script type="module" src="homework-9.js"></script>
        <script type="module" src="homewor-10.js"></script>
        <script src="homework-11.js"></script>
    </body>
</html>
